<div class="inventory-sidebar sticky-lg-top">
    <div class="inventory-sidebar-head">
        <div class="inventory-sidebar-copy">
            <div class="inventory-sidebar-brand-row">
                <span class="inventory-sidebar-badge"><i class="fa-solid fa-warehouse"></i></span>
                <div>
                    <h6 class="inventory-sidebar-title mb-0">Inventory</h6>
                    <span class="inventory-sidebar-subtitle">Stock & Ledgers</span>
                </div>
            </div>
        </div>
        <button
            class="inventory-sidebar-toggle"
            type="button"
            data-inventory-sidebar-toggle
            aria-label="Collapse inventory sidebar"
            aria-expanded="true"
            data-tooltip="Collapse sidebar (Ctrl+B)"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>
    </div>

    {% if user.is_staff and staff_access.staff_dashboard %}
    <div class="inventory-sidebar-return-wrap">
        <a class="inventory-sidebar-return-link" href="{% url 'staff_dashboard' %}" data-tooltip="Back to Main App">
            <i class="fa-solid fa-arrow-left inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Main Dashboard</span>
        </a>
    </div>
    {% endif %}

    <nav class="inventory-sidebar-nav" aria-label="Inventory Navigation">
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_dashboard' %}active{% endif %}" href="{% url 'inventory_dashboard' %}" data-tooltip="Overview" hx-get="{% url 'inventory_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-chart-pie inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Overview</span>
        </a>
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_product_dashboard' or request.resolver_match.url_name == 'product_dashboard' or request.resolver_match.url_name == 'inventory_product_ledger' %}active{% endif %}" href="{% url 'inventory_product_dashboard' %}" data-tooltip="Products" hx-get="{% url 'inventory_product_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-boxes-stacked inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Products</span>
        </a>
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_party_dashboard' or request.resolver_match.url_name == 'inventory_party_ledger' %}active{% endif %}" href="{% url 'inventory_party_dashboard' %}" data-tooltip="Parties" hx-get="{% url 'inventory_party_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-users inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Parties</span>
        </a>
        <div class="inventory-nav-divider"></div>
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_purchase_dashboard' %}active{% endif %}" href="{% url 'inventory_purchase_dashboard' %}" data-tooltip="Purchase" hx-get="{% url 'inventory_purchase_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-cart-arrow-down inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Purchase</span>
        </a>
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_purchase_return_dashboard' %}active{% endif %}" href="{% url 'inventory_purchase_return_dashboard' %}" data-tooltip="Purchase Return" hx-get="{% url 'inventory_purchase_return_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-rotate-left inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Purchase Return</span>
        </a>
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_sales_dashboard' %}active{% endif %}" href="{% url 'inventory_sales_dashboard' %}" data-tooltip="Sales" hx-get="{% url 'inventory_sales_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-cart-shopping inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Sales</span>
        </a>
        <a class="nav-link inventory-nav-link {% if request.resolver_match.url_name == 'inventory_sales_return_dashboard' %}active{% endif %}" href="{% url 'inventory_sales_return_dashboard' %}" data-tooltip="Sales Return" hx-get="{% url 'inventory_sales_return_dashboard' %}" hx-target=".app-main > .container" hx-select=".app-main > .container" hx-swap="outerHTML show:top" hx-push-url="true">
            <i class="fa-solid fa-rotate-right inventory-sidebar-icon"></i>
            <span class="inventory-sidebar-link-label">Sales Return</span>
        </a>
    </nav>
</div>
